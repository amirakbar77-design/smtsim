# Example line configuration: pass it with `smtsim run --config line.example.toml`.
#
# This file reproduces the built-in defaults. Edit the numbers to ask what-if
# questions -- for example, give pick_and_place a second head by setting its
# capacity to 2, and watch the bottleneck move to the reflow oven.
#
# TOML is read with the standard library. The same document in YAML also works
# if you installed the optional extra: `uv sync --extra yaml`.

name = "SMT line 1"
seed = 42

# Bare boards enter the line every ~57 s. Because that is close to the
# pick-and-place cycle time, a queue builds in front of it on its own.
[arrivals.interarrival]
kind = "lognormal"
mean = 57.0
cv = 0.45
# limit = 500   # stop feeding after this many boards; omit for a continuous feed

# input_buffer is the length of the conveyor feeding a station, in boards. A
# board holds a slot on it from the moment it joins the queue until the machine
# lifts it off, so a station's total work-in-progress is input_buffer + capacity.
# Omit it for an unbounded buffer, which is what the printer gets here: it is
# fed from a magazine of bare boards rather than from a conveyor.
#
# When a conveyor fills, the machine behind it finishes its board and then
# cannot put it down: it BLOCKS. When one empties, the machine in front of it
# STARVES. The last station never blocks -- its boards leave the line.
[[stations]]
name = "solder_paste_printer"
capacity = 1
[stations.service_time]
kind = "lognormal"
mean = 25.0
cv = 0.15

[[stations]]
name = "pick_and_place"
input_buffer = 3
capacity = 1
[stations.service_time]
kind = "lognormal"
mean = 52.0
cv = 0.20
# Breakdowns are optional. A station with no [stations.failures] block never
# fails. mtbf is measured in OPERATING seconds -- the countdown to the next
# failure only runs while the machine is working, so an idle machine does not
# wear out. Time to failure is exponential; repair time is lognormal with
# mean mttr and coefficient of variation mttr_cv.
# [stations.failures]
# mtbf = 5400.0
# mttr = 420.0
# mttr_cv = 0.6

[[stations]]
name = "spi"
input_buffer = 3
capacity = 1
[stations.service_time]
kind = "triangular"
low = 14.0
mode = 17.0
high = 26.0

[[stations]]
name = "reflow_oven"
input_buffer = 3
capacity = 6
[stations.service_time]
kind = "constant"
seconds = 240.0
