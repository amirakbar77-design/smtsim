[project]
name = "smtsim"
version = "0.3.0"
description = "Discrete-event simulation of an SMT (surface-mount technology) PCB assembly line."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amir Akbar", email = "amirakbar77@gmail.com" }]
dependencies = [
    "simpy>=4.1",
    "rich>=13.7",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
smtsim = "smtsim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smtsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
